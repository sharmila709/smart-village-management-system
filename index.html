<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Digital Village</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4efff;
            color: #3b176d;
        }

        header {
            background: #4b168c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 32px;
        }

        .hero {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 8%;
            gap: 40px;
        }

        .content {
            max-width: 550px;
        }

        .content h2 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #5d4775;
        }

        .btn {
            display: inline-block;
            background: #4b168c;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 17px;
        }

        .btn:hover {
            background: #351064;
        }

        .image-box {
            width: 48%;
        }

        .image-box img {
            width: 100%;
            max-height: 430px;
            object-fit: cover;
            border-radius: 18px;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 35px 20px;
            }

            .content h2 {
                font-size: 38px;
            }

            .image-box {
                width: 100%;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Digital Village Management System</h1>
    </header>

    <section class="hero">

        <div class="content">
            <h2>Building a Smarter Village</h2>

            <p>
                Connecting people, services and technology
                for a better digital village.
            </p>

            <a href="portal.html" class="btn">
                Get Started →
            </a>
        </div>

        <div class="image-box">
            <img src="assets/landing-village.png" alt="Smart Village">
        </div>

    </section>

</body>
</html>
