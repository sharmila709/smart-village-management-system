<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Digital Village System - Registration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        
        }

        body{
            background:linear-gradient(135deg,indigo);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .register-container{
            width:450px;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        .logo{
            text-align:center;
            font-size:60px;
        }

        h2{
            text-align:center;
            color:#333;
            margin:10px 0 5px;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
            color:indigo;
        }

        input, select, textarea{
            width:100%;
            padding:10px;
            border:1px solid indigo;
            border-radius:8px;
            font-size:15px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border-color:indigo;
        }

        textarea{
            resize:none;
        }

        .btn{
            width:100%;
            padding:12px;
            background:indigo;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            margin-top:10px;
        }

        .btn:hover{
            background:#382865;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            text-decoration:none;
            color:indigo;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            font-size:13px;
            color:gray;
        }
    </style>

</head>
<body style=" font-family: 'Playfair Display', serif;">

<div class="register-container">

    <div class="logo">🏡</div>

    <h2>Smart Digital Village System</h2>
    <p>Create Your Account</p>

    <form action="login.html">

        <div class="input-group">
            <label>Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email ID</label>
            <input type="email" placeholder="Enter your email" required>
        </div>


        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Create a username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="btn">Register</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

    <div class="footer">
        © 2026 Smart Digital Village System
    </div>

</div>

</body>
</html>
